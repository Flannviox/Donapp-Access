[versions]
agp                = "8.10.0"
kotlin             = "2.1.0"
coreKtx            = "1.16.0"
appcompat          = "1.7.0"
material           = "1.12.0"
activity           = "1.10.1"
constraintlayout   = "2.2.1"
lifecycle          = "2.9.0"
navigation         = "2.9.0"
room               = "2.7.1"
hilt               = "2.56.1"
coroutines         = "1.10.2"
supabase           = "3.1.4"
ktor               = "3.1.3"
mapbox             = "11.10.0"
glide              = "4.16.0"
junit              = "4.13.2"
junitExt           = "1.2.1"
espresso           = "3.6.1"
play-services-location = "21.3.0"

[libraries]
# AndroidX Core
androidx-core-ktx         = { group = "androidx.core",               name = "core-ktx",           version.ref = "coreKtx" }
androidx-appcompat        = { group = "androidx.appcompat",           name = "appcompat",           version.ref = "appcompat" }
material                  = { group = "com.google.android.material",  name = "material",            version.ref = "material" }
androidx-activity         = { group = "androidx.activity",            name = "activity",            version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout",    name = "constraintlayout",    version.ref = "constraintlayout" }

# Lifecycle + ViewModel + LiveData
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata  = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx",  version.ref = "lifecycle" }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",   version.ref = "lifecycle" }

# Navigation Component
androidx-navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui       = { group = "androidx.navigation", name = "navigation-ui-ktx",       version.ref = "navigation" }

# Room
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# Hilt
hilt-android  = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Supabase
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt", version.ref = "supabase" }
supabase-auth      = { group = "io.github.jan-tennert.supabase", name = "auth-kt",      version.ref = "supabase" }
supabase-storage   = { group = "io.github.jan-tennert.supabase", name = "storage-kt",   version.ref = "supabase" }
supabase-realtime  = { group = "io.github.jan-tennert.supabase", name = "realtime-kt",  version.ref = "supabase" }

# Ktor (requerido internamente por Supabase)
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-core    = { group = "io.ktor", name = "ktor-client-core",    version.ref = "ktor" }

# Mapbox
mapbox-android = { group = "com.mapbox.maps", name = "android", version.ref = "mapbox" }

# Glide (carga de imágenes desde URL)
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }


play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

# Testing
junit                  = { group = "junit",                  name = "junit",         version.ref = "junit" }
androidx-junit         = { group = "androidx.test.ext",      name = "junit",         version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }



[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-kapt         = { id = "org.jetbrains.kotlin.kapt",           version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
navigation-safeargs = { id = "androidx.navigation.safeargs.kotlin", version.ref = "navigation" }